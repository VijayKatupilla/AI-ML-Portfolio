<svg viewBox="0 0 1040 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #120E1A; }
      .panel { fill: #1B1526; stroke: #33294A; stroke-width: 1.5; }
      .title { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 700; fill: #F3EFFA; }
      .subtitle { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #9C8FB5; }
      .num { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 700; }
      .label { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 700; fill: #F3EFFA; }
      .desc { font-family: Arial, Helvetica, sans-serif; fill: #9C8FB5; }
    </style>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#33294A"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="460"/>

  <text x="520" y="42" text-anchor="middle" class="title" font-size="22">A Living Framework, Not a Filed Document</text>
  <text x="520" y="64" text-anchor="middle" class="subtitle" font-size="12">Five parts, meant to be revisited and rewritten, not written once</text>

  <!-- connecting flow line -->
  <path d="M 130 250 L 950 250" stroke="#33294A" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M 950 280 Q 950 380 520 380 Q 90 380 90 280" stroke="#33294A" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrow2)"/>
  <text x="520" y="410" text-anchor="middle" class="desc" font-size="11.5" fill="#E85D75">revisited quarterly, rewritten annually</text>

  <!-- 5 nodes -->
  <!-- Mission -->
  <circle cx="130" cy="200" r="42" fill="none" stroke="#F5A623" stroke-width="2.5"/>
  <text x="130" y="196" text-anchor="middle" class="num" font-size="13" fill="#F5A623">01</text>
  <text x="130" y="214" text-anchor="middle" class="label" font-size="11">Mission</text>
  <text x="130" y="264" text-anchor="middle" class="desc" font-size="11">Why I lead</text>

  <!-- Values -->
  <circle cx="335" cy="200" r="42" fill="none" stroke="#2DD4E8" stroke-width="2.5"/>
  <text x="335" y="196" text-anchor="middle" class="num" font-size="13" fill="#2DD4E8">02</text>
  <text x="335" y="214" text-anchor="middle" class="label" font-size="11">Values</text>
  <text x="335" y="264" text-anchor="middle" class="desc" font-size="11">What I won't compromise</text>

  <!-- Objectives -->
  <circle cx="540" cy="200" r="42" fill="none" stroke="#B794F6" stroke-width="2.5"/>
  <text x="540" y="196" text-anchor="middle" class="num" font-size="13" fill="#B794F6">03</text>
  <text x="540" y="214" text-anchor="middle" class="label" font-size="11">Objectives</text>
  <text x="540" y="264" text-anchor="middle" class="desc" font-size="11">Measurable, tied to real gaps</text>

  <!-- Action Plans -->
  <circle cx="745" cy="200" r="42" fill="none" stroke="#4ADE80" stroke-width="2.5"/>
  <text x="745" y="196" text-anchor="middle" class="num" font-size="13" fill="#4ADE80">04</text>
  <text x="745" y="214" text-anchor="middle" class="label" font-size="11">Action Plans</text>
  <text x="745" y="264" text-anchor="middle" class="desc" font-size="11">Short and long term</text>

  <!-- Evaluation -->
  <circle cx="950" cy="200" r="42" fill="none" stroke="#E85D75" stroke-width="2.5"/>
  <text x="950" y="196" text-anchor="middle" class="num" font-size="13" fill="#E85D75">05</text>
  <text x="950" y="214" text-anchor="middle" class="label" font-size="10">Evaluation</text>
  <text x="950" y="264" text-anchor="middle" class="desc" font-size="11">Quarterly check, annual rewrite</text>

  <text x="520" y="440" text-anchor="middle" class="subtitle" font-size="11">AIML-500 · Vijay Katupilla</text>
</svg>
